name: Respaldo municipal cifrado
on:
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * *'
permissions:
  contents: read
concurrency:
  group: municipal-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.event_name == 'workflow_dispatch' || vars.MUNICIPAL_BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramientas fijadas
        run: |
          python -m pip install uv==0.12.11
          uv sync --frozen --group operations
      - name: Crear y verificar copia cifrada
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.MUNICIPAL_BACKUP_ACCESS_TOKEN }}
          MUNIGEST_BACKUP_STORAGE_KEY: ${{ secrets.MUNICIPAL_BACKUP_STORAGE_KEY }}
          MUNIGEST_BACKUP_PASSPHRASE: ${{ secrets.MUNICIPAL_BACKUP_PASSPHRASE }}
        run: uv run python scripts/municipal_backup.py backup --non-interactive --output artifacts/respaldo-municipal.mgb
      - name: Conservar únicamente el archivo cifrado
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-municipal-${{ github.run_id }}
          path: artifacts/respaldo-municipal.mgb
          if-no-files-found: error
          retention-days: 30

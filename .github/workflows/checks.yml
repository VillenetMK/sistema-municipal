name: Pruebas y permisos
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar uv
        run: python -m pip install uv==0.12.11
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts run.py
      - run: uv run pytest -q
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: municipal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: local-test-only
    steps:
      - uses: actions/checkout@v4
      - name: Probar esquema y aislamiento de permisos
        run: |
          psql -h localhost -U postgres -d municipal_test -v ON_ERROR_STOP=1 -f tests/bootstrap_database.sql
          for migration in supabase/migrations/*.sql; do
            psql -h localhost -U postgres -d municipal_test -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -h localhost -U postgres -d municipal_test -v ON_ERROR_STOP=1 -f tests/database_contract.sql

name: Publicar MuniGest web

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/migrations/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/web.yml'
      - 'src/**'
      - 'scripts/build_web.py'
      - 'scripts/web_smoke.py'
      - 'scripts/prepare_client.py'
      - 'tests/test_web_runtime.py'
      - 'tests/test_session_persistence.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.env.example'

permissions:
  contents: read

concurrency:
  group: municipal-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Comprobar navegador (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [supabase, demo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramientas
        run: |
          python -m pip install uv==0.12.11
          uv sync --frozen --group operations
          uv run ruff check src tests scripts run.py
          uv run pytest -q
          uv run --with playwright==1.58.0 python -m playwright install --with-deps chromium
      - name: Empaquetar aplicación Python para navegador
        env:
          APP_MODE: ${{ matrix.mode }}
        run: uv run python scripts/build_web.py --mode "$APP_MODE"
      - name: Comprobar aplicación, conexión y documentos
        env:
          APP_MODE: ${{ matrix.mode }}
        run: uv run --with playwright==1.58.0 python scripts/web_smoke.py --mode "$APP_MODE"
      - name: Guardar comprobaciones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-web-${{ matrix.mode }}
          path: artifacts/web/
          if-no-files-found: ignore
          retention-days: 30
      - name: Preparar publicación municipal
        if: matrix.mode == 'supabase'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/sistema-municipal

  deploy:
    name: Publicar sistema en GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build-test
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar versión comprobada
        id: deployment
        uses: actions/deploy-pages@v4

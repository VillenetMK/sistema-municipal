services:
  municipal:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8550:8550"
    environment:
      MUNIGEST_MODE: supabase
      MUNIGEST_NAME: MuniGest Chiclayo
      SUPABASE_PROJECT_REF: lxvmwjcqdjoidgpinmgm
      SUPABASE_URL: https://lxvmwjcqdjoidgpinmgm.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Configura la clave publicable municipal}
      PORT: "8550"
    read_only: true
    tmpfs:
      - /tmp:size=134217728,mode=1777
      - /home/municipal:uid=10001,gid=10001,size=134217728
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

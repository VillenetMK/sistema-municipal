[project]
name = "munigest"
version = "0.1.0"
description = "Mesa de partes y seguimiento interno de expedientes municipales"
requires-python = ">=3.12,<3.14"
dependencies = [
    "flet==1.0.0",
    "httpx[socks]==0.28.1",
    "python-dotenv==1.1.1",
    "reportlab==5.0.1",
]

[project.optional-dependencies]
desktop = ["flet-desktop==1.0.0"]
server = ["flet-web==1.0.0"]

[dependency-groups]
dev = [
    "flet-cli==1.0.0",
    "flet-web==1.0.0",
    "pypdf==6.10.2",
    "pytest==8.4.2",
    "ruff==0.13.0",
]
operations = [
    "cryptography==48.0.1",
]

[tool.flet]
org = "pe.munigest"
bundle_id = "pe.munigest.chiclayo"
product = "MuniGest Chiclayo"
company = "MuniGest - Piloto municipal"

[tool.flet.app]
path = "src"

[tool.flet.android]
min_sdk_version = 24
target_arch = ["arm64-v8a", "armeabi-v7a", "x86_64"]
# PDF usa las fuentes Vera mediante rutas reales; no pueden quedarse dentro de un ZIP.
extract_packages = ["reportlab"]
# El piloto se instala descargando un APK, sin pasar por Google Play.
legacy_packaging = true

[tool.flet.android.gradle_properties]
# Las descargas de las tres ABI comparten un archivo de metadatos ETag.
# Serializarlas evita que Gradle lea ese JSON mientras otra descarga lo escribe.
"org.gradle.workers.max" = "1"
"org.gradle.parallel" = "false"

[tool.flet.android.manifest_application]
allowBackup = "false"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
# FilePicker usa el selector del sistema, sin acceso general al almacenamiento.
"android.permission.READ_EXTERNAL_STORAGE" = false
"android.permission.WRITE_EXTERNAL_STORAGE" = false
"android.permission.READ_MEDIA_IMAGES" = false
"android.permission.READ_MEDIA_VIDEO" = false

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
